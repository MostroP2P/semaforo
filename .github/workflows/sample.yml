name: Sample

# The history sampler (SPEC § 3.5). GitHub's cron is best effort: it starts
# late, skips runs, and on a quiet repository can fire a few times a day. So
# one run is not one sample: a job samples in a loop for sampler_run_minutes
# (config.json, which caps it under the six-hour job limit with room for the
# setup and the last pass), storing a sample once sample_interval_minutes
# have passed since the last stored one and pushing the data branch after
# each. The cron only has to fire once per run, not
# once per sample, and the minute is off the hour, the busiest time.
# Samples live on the `data` branch, which this workflow creates on its
# first run; the page reads the daily records from that branch, so a push
# here is all it takes for a new bar to show.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: two pushing the data branch at once would race. A run
# that fires while one is active waits for it, so the loop carries on from
# one job to the next with no gap but the checkout.
concurrency:
  group: sample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install the relay library
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check out the data branch
        run: |
          if git fetch --depth=1 origin data; then
            git worktree add -b data data-branch origin/data
          else
            git worktree add --orphan -b data data-branch
          fi
      # Only a pass that stored samples has anything to roll up or push; the
      # others would only move today's fractions and commit every minute.
      - name: Sample until the run's time is up
        working-directory: data-branch
        run: |
          minutes=$(node -p "require('../config.json').sampler_run_minutes")
          deadline=$(( $(date +%s) + minutes * 60 ))
          while :; do
            node ../scripts/sample.mjs data
            if [ -n "$(git status --porcelain -- data/last.json)" ]; then
              node ../scripts/rollup.mjs data
              git add -A
              git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
                commit -q -m "sample: $(date -u +%Y-%m-%dT%H:%MZ)"
              # Nothing else pushes this branch while a run is active, but a
              # run that started before a manual push to it must not die here.
              git push origin data || { git pull --rebase origin data && git push origin data; }
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "run time is up"
              break
            fi
            sleep 60
          done
