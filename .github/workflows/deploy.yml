name: Deploy

# Publishes the site to GitHub Pages at status.mostro.network. The tests run
# first, and the build refuses invalid settings, so neither reaches visitors.
# The sampling workflow dispatches a run after each sample it stores, so the
# bars follow the data branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Tests
        run: npm run test:coverage
      - name: Build the site with its Content-Security-Policy
        run: node scripts/build-site.mjs _site
      # Only the daily records are published; the raw samples stay on the
      # branch. Before the first sample there is no branch, and no history.
      - name: Add the history from the data branch
        run: |
          if git fetch --depth=1 origin data; then
            git archive FETCH_HEAD data/daily | tar -x -C _site
          else
            echo "no data branch yet"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
