<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- CONTENT-SECURITY-POLICY: the deploy workflow writes the policy here. -->
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Semáforo · Mostro status</title>
  <meta name="description" content="The live health of trusted Mostro instances, read from their signed Nostr events and verified in your browser.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/nostr-tools@2.25.2/lib/nostr.bundle.js"
          integrity="sha384-FXQAsrQPF8+Yw4G9sjW+s9sUIozKgjjidpD4OPcUaIxR5Z7gMcDFArOKmEq+KES2"
          crossorigin="anonymous" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./">
      <svg class="logo" viewBox="0 0 24 56" aria-hidden="true" focusable="false">
        <rect class="housing" x="1" y="1" width="22" height="54" rx="8"/>
        <circle class="lamp lamp-red" cx="12" cy="12" r="6"/>
        <circle class="lamp lamp-yellow" cx="12" cy="28" r="6"/>
        <circle class="lamp lamp-green" cx="12" cy="44" r="6"/>
      </svg>
      <span class="brand-name">Semáforo</span>
      <span class="brand-sub" id="heading">Mostro status</span>
    </a>
    <div class="controls">
      <div class="lang" id="lang" role="group" aria-label="Language">
        <button type="button" data-lang="es" aria-pressed="false">es</button>
        <button type="button" data-lang="en" aria-pressed="true">en</button>
      </div>
      <button type="button" class="theme" id="theme" aria-label="Switch between light and dark theme">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
          <circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M10 2a8 8 0 0 1 0 16z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section class="banner state-grey" id="banner" aria-live="polite">
      <div class="banner-main">
        <svg class="logo" viewBox="0 0 24 56" aria-hidden="true" focusable="false">
          <rect class="housing" x="1" y="1" width="22" height="54" rx="8"/>
          <circle class="lamp lamp-red" cx="12" cy="12" r="6"/>
          <circle class="lamp lamp-yellow" cx="12" cy="28" r="6"/>
          <circle class="lamp lamp-green" cx="12" cy="44" r="6"/>
        </svg>
        <p class="banner-text" id="banner-text">Checking…</p>
      </div>
    </section>
    <ul class="counts" id="counts"></ul>

    <section class="instances-section" aria-labelledby="history-title">
      <div class="section-head">
        <h2 id="history-title">Uptime over the last 90 days</h2>
        <p class="history-note" id="history-note"></p>
      </div>
      <ul class="instances" id="instances"></ul>
    </section>

    <section class="watchers state-none" id="watchers" aria-labelledby="watchers-title">
      <h2 id="watchers-title">Monitoring</h2>
      <p class="watchers-summary" id="watchers-summary"></p>
      <ul class="watchers-list" id="watchers-list"></ul>
    </section>

    <noscript>
      <p class="noscript">Esta página necesita JavaScript para leer los eventos firmados y verificarlos en tu navegador.<br>
      This page needs JavaScript to read the signed events and verify them in your browser.</p>
    </noscript>
  </main>

  <footer class="foot">
    <a id="footer-how" href="https://github.com/MostroP2P/semaforo/blob/main/docs/SPEC.md">How it works</a>
    <a id="footer-github" href="https://github.com/MostroP2P/semaforo">GitHub</a>
    <span id="footer-tracking">No backend, no cookies, no tracking.</span>
  </footer>
</body>
</html>
